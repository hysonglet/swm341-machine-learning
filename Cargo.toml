[package]
name = "swm341-ai"
version = "0.1.0"
edition = "2021"
description = "SWM341 上的端侧机器学习：从算子自检到手写数字识别（纯 Rust，无 C 工具链）"
license = "MIT"
# `cargo run` 默认烧录哪一个历程。
default-run = "03_sd_image"

[dependencies]
# 用本地路径：本仓库和 HAL 一起改最方便。
# 换机器/发布时可以改成
# swm341-hal = { git = "ssh://git@github.com/hysonglet/swm341-hal.git", branch = "main" }
swm341-hal = { path = "../swm341-hal" }

# 定点神经网络算子库：纯 Rust、#![no_std]、零堆分配，
# API 与 Arm CMSIS-NN 一一对应（convolve_s8 / fully_connected_s8 / softmax_s8 ...），
# 但不需要 arm-none-eabi-gcc、bindgen、CMake，交叉编译只走 rustc。
embedded-nn = "0.2.3"

# 与硬件无关的纯 Rust 推理核心：预处理 + int8 模型。
# 主机端（host/）和 SWM341 固件共用同一份代码、同一个 embedded-nn 算子。
core_ml = { path = "core_ml" }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
panic-halt = "0.2"
rtt-target = "0.5"

# SDRAM 上的全局分配器：PNG 解码 + FAT 文件系统都需要 alloc。
embedded-alloc = "0.5"

# no_std 下的浮点超越函数（expf 等）。SWM341 是 eabihf（有 FPU），f32 算术走硬件；
# 这里只用 libm::expf 给 softmax 算真概率，调用频率极低（每个样本 10 次），开销可忽略。
libm = "0.2"

# 注：原本这里依赖了 fatfs（0.3）给「SD 卡读图」预留，但 fatfs 0.3.x 在 no_std + stable
# 下需要 nightly 的 `#![feature(alloc)]`，编不过；而且当前所有 bin（含 02_infer）都没用到它
# （板端权重/样例走 `include_bytes!`）。等真正做 SD 卡 FAT 读写时，再换一个 stable 兼容的
# crate（如 fatfs 的旧 0.2.x 分支、或 embedded-fatfs）并在此重新引入。
# fatfs = { version = "0.3", default-features = false, features = ["alloc"] }

# PNG 的 zlib/deflate 解压（no_std + alloc）。
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

# ---------------------------------------------------------------- 历程（bin）--
[[bin]]
name = "00_hello"
path = "src/bin/00_hello.rs"
test = false
bench = false

[[bin]]
name = "01_nn_smoke"
path = "src/bin/01_nn_smoke.rs"
test = false
bench = false

[[bin]]
name = "02_infer"
path = "src/bin/02_infer.rs"
test = false
bench = false

[[bin]]
name = "02_sdram"
path = "src/bin/02_sdram.rs"
test = false
bench = false

[[bin]]
name = "03_sd_image"
path = "src/bin/03_sd_image.rs"
test = false
bench = false

# ------------------------------------------------------------------ profiles --
[profile.release]
codegen-units = 1
debug = 1
lto = true
opt-level = "s"

# 裸机工程的 debug 也需要体积/速度优化，否则算子的循环会慢得离谱，
# 周期数统计也就失去意义。
[profile.dev]
codegen-units = 1
debug = 1
incremental = false
opt-level = "s"
