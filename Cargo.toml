[package]
name = "swm341-ai"
version = "0.1.0"
edition = "2021"
description = "SWM341 上的端侧机器学习：从算子自检到手写数字识别（纯 Rust，无 C 工具链）"
license = "MIT"
# `cargo run` 默认烧录哪一个历程。当前在调手写数字页面，默认 06_digit_ui。
default-run = "06_digit_ui"

[dependencies]
# 用本地路径：本仓库和 HAL 一起改最方便。
# 换机器/发布时可以改成
# swm341-hal = { git = "ssh://git@github.com/hysonglet/swm341-hal.git", branch = "main" }
swm341-hal = { path = "../swm341-hal" }

# 定点神经网络算子库：纯 Rust、#![no_std]、零堆分配，
# API 与 Arm CMSIS-NN 一一对应（convolve_s8 / fully_connected_s8 / softmax_s8 ...），
# 但不需要 arm-none-eabi-gcc、bindgen、CMake，交叉编译只走 rustc。
embedded-nn = "0.2.3"

# 与硬件无关的纯 Rust 推理核心：预处理 + int8 模型。
# 主机端（host/）和 SWM341 固件共用同一份代码、同一个 embedded-nn 算子。
core_ml = { path = "core_ml" }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
panic-halt = "0.2"
rtt-target = "0.5"

# SDRAM 上的全局分配器：PNG 解码 + FAT 文件系统都需要 alloc。
embedded-alloc = "0.5"

# no_std 下的浮点超越函数（expf 等）。SWM341 是 eabihf（有 FPU），f32 算术走硬件；
# 这里只用 libm::expf 给 softmax 算真概率，调用频率极低（每个样本 10 次），开销可忽略。
libm = "0.2"

# FAT 文件系统：纯 Rust、`no_std` 兼容，支持 FAT12/16/32 读写（不只是只读）。
# 默认 features 带 `std`/`write`/`lfn`，这里关掉 `std` 改用 `alloc`（堆落在 SDRAM 上），
# 并开 `sync` 同步 API + `read` + `lfn`。块设备 trait 来自它的依赖 `hadris-io`。
hadris-fat = { version = "2.5", default-features = false, features = ["alloc", "sync", "read", "lfn"] }

# 让 `SdCard` 实现 hadris-fat 需要的 `Read`/`Seek` 块设备抽象。
embedded-io = "0.7"

# PNG 的 zlib/deflate 解压（no_std + alloc）。
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

# GUI：LVGL 9.5 的安全 Rust 绑定。底层 oxivgl-sys 用 cc + bindgen 从源码编译
# LVGL C 库，配置由 conf/lv_conf.h 提供（见 .cargo/config.toml 的 DEP_LV_CONFIG_PATH）。
oxivgl = { version = "0.9.2", default-features = false }
# 直接依赖同一份 FFI，用于移植 flush_cb、覆盖 display 的颜色格式等底层接线。
# 版本必须与 oxivgl 0.9.2 内部依赖的 oxivgl-sys 0.2.6 一致，否则会出现两套
# LVGL 符号/两份 C 静态库。
#
# `use-string-functions` 必须开：lv_conf.h 的 LV_USE_STDLIB_STRING=CLIB 让 LVGL
# 的 C 代码直接调 strlen/strcmp/strncpy/strnlen，而裸机没有 libc。这个 feature
# 用纯 Rust 提供这些 extern "C" 符号。oxivgl 内部把 oxivgl-sys 的 default features
# 关掉了（ESP32 有 newlib），我们在这里补回来，feature 会合并到同一份 crate 实例。
oxivgl-sys = { version = "0.2.6", default-features = false, features = ["use-string-functions"] }

# oxivgl 的 build.rs 会无条件生成三个用不到的示例图片资源（需要 pypng/lz4，
# 还占 flash）。用本地 no-op 版本顶掉这一步，详见 vendor/oxivgl-build/src/lib.rs。
[patch.crates-io]
oxivgl-build = { path = "vendor/oxivgl-build" }

# ---------------------------------------------------------------- 历程（bin）--
[[bin]]
name = "00_hello"
path = "src/bin/00_hello.rs"
test = false
bench = false

[[bin]]
name = "01_nn_smoke"
path = "src/bin/01_nn_smoke.rs"
test = false
bench = false

[[bin]]
name = "02_infer"
path = "src/bin/02_infer.rs"
test = false
bench = false

[[bin]]
name = "02_sdram"
path = "src/bin/02_sdram.rs"
test = false
bench = false

[[bin]]
name = "03_sd_image"
path = "src/bin/03_sd_image.rs"
test = false
bench = false

[[bin]]
name = "04_lcd"
path = "src/bin/04_lcd.rs"
test = false
bench = false

[[bin]]
name = "05_oxivgl"
path = "src/bin/05_oxivgl.rs"
test = false
bench = false

[[bin]]
name = "06_digit_ui"
path = "src/bin/06_digit_ui.rs"
test = false
bench = false

[[bin]]
name = "07_sd_ui"
path = "src/bin/07_sd_ui.rs"
test = false
bench = false

[[bin]]
name = "08_draw_ui"
path = "src/bin/08_draw_ui.rs"
test = false
bench = false

# ------------------------------------------------------------------ profiles --
[profile.release]
codegen-units = 1
debug = 1
lto = true
opt-level = "s"

# 裸机工程的 debug 也需要体积/速度优化，否则算子的循环会慢得离谱，
# 周期数统计也就失去意义。
[profile.dev]
codegen-units = 1
debug = 1
incremental = false
opt-level = "s"
# 07_sd_ui 带上 LVGL + FAT + PNG 解码后，dev 下不开 LTO 会超 512K flash 约 6KB。
# 开 LTO 后 text 341K→317K / rodata 189K→177K，能留出约 17K 余量。
# 代价：每次改代码后的链接稍慢（LTO 需要重跑整体优化）。
lto = true
